<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Ürün Detay</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

.kutu{
max-width:800px;
margin:50px auto;
background:white;
padding:20px;
border-radius:15px;
display:flex;
gap:20px;
}

.kutu img{
width:300px;
border-radius:10px;
}

.info h2{
margin:0;
}

.fiyat{
font-size:22px;
font-weight:bold;
margin:10px 0;
}

button{
padding:10px;
border:none;
background:black;
color:white;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="kutu">
<img id="resim">

<div class="info">
<h2 id="urunAdi"></h2>
<div class="fiyat" id="fiyat"></div>

<button onclick="sepeteEkle()">Sepete Ekle</button>
<button onclick="favori()">🤍 Favori</button>
</div>
</div>

<script>
let url = new URLSearchParams(window.location.search);

let urun = url.get("urun");
let fiyat = url.get("fiyat");
let img = url.get("img");

document.getElementById("urunAdi").innerText = urun;
document.getElementById("fiyat").innerText = fiyat + "₺";
document.getElementById("resim").src = "ürün fotoğrafları/" + img;

function sepeteEkle(){
let sepet = JSON.parse(localStorage.getItem("sepet")) || [];
sepet.push({isim:urun,fiyat:fiyat});
localStorage.setItem("sepet",JSON.stringify(sepet));
alert("Sepete eklendi!");
}

function favori(){
let fav = JSON.parse(localStorage.getItem("favoriler")) || [];
fav.push({isim:urun,fiyat:fiyat});
localStorage.setItem("favoriler",JSON.stringify(fav));
alert("Favoriye eklendi!");
}
</script>

</body>
</html>
